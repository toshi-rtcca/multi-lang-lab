[project]
name = "word-count"
version = "0.1.0"
description = "Word count CLI tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
word_count = "word_count.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/word_count"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
