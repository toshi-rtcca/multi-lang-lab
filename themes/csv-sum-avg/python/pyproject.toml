[project]
name = "csv-sum-avg"
version = "0.1.0"
description = "CSV sum and average calculator CLI tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
csv_sum_avg = "csv_sum_avg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_sum_avg"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
