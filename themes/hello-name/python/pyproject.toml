[project]
name = "hello-name"
version = "0.1.0"
description = "Display personalized greeting via CLI argument"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
hello_name = "hello_name.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_name"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
