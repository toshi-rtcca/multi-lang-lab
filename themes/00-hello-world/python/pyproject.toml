[project]
name = "hello-world"
version = "0.1.0"
description = "Display Hello world on a text console"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
hello_world = "hello_world.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_world"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
