[project]
name = "datetime-basic"
version = "0.1.0"
description = "Basic datetime operations CLI tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
datetime_basic = "datetime_basic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datetime_basic"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
