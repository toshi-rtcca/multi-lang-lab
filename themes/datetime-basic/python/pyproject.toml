[project]
name = "datetime-basic"
version = "0.1.0"
description = "Strict date parsing and offset-aware date arithmetic with the datetime module"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datetime_basic"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
