[project]
name = "reverse-string"
version = "0.1.0"
description = "Reverse a string at the grapheme cluster level"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["grapheme>=0.6"]

[project.scripts]
reverse_string = "reverse_string.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_string"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
