[project]
name = "http-get"
version = "0.1.0"
description = "Get an HTTP status code with a synchronous client"
requires-python = ">=3.11"
dependencies = ["httpx2>=2.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/http_get"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
