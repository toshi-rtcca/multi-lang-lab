[project]
name = "n-queens"
version = "0.1.0"
description = "Backtracking solver for the N-Queens problem"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
n-queens = "n_queens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n_queens"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
